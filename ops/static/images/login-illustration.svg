<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none">
  <!-- soft background glow -->
  <circle cx="330" cy="260" r="150" fill="#F4842B" opacity="0.08" />
  <circle cx="60" cy="60" r="90" fill="#F4842B" opacity="0.06" />

  <!-- decorative dot grid -->
  <g fill="#F4842B" opacity="0.35">
    <circle cx="392" cy="34" r="3" /><circle cx="408" cy="34" r="3" /><circle cx="424" cy="34" r="3" />
    <circle cx="392" cy="50" r="3" /><circle cx="408" cy="50" r="3" /><circle cx="424" cy="50" r="3" />
    <circle cx="392" cy="66" r="3" /><circle cx="408" cy="66" r="3" /><circle cx="424" cy="66" r="3" />
  </g>

  <!-- Users card -->
  <g>
    <rect x="16" y="24" width="240" height="220" rx="18" fill="#FFFFFF" stroke="#EFE9E3" stroke-width="1.5" />
    <text x="40" y="64" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#222221">Users</text>
    <line x1="40" y1="80" x2="232" y2="80" stroke="#EFE9E3" stroke-width="1.5" />

    <!-- row 1 -->
    <circle cx="56" cy="106" r="14" fill="#FDE3CF" />
    <text x="56" y="111" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#C2571A" text-anchor="middle">JD</text>
    <rect x="80" y="101" width="60" height="9" rx="4" fill="#E4DFD9" />
    <rect x="176" y="97" width="66" height="18" rx="9" fill="#EDE9FE" />
    <text x="209" y="109" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#6D28D9" text-anchor="middle">Admin</text>

    <!-- row 2 -->
    <circle cx="56" cy="146" r="14" fill="#FDE3CF" />
    <text x="56" y="151" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#C2571A" text-anchor="middle">MS</text>
    <rect x="80" y="141" width="72" height="9" rx="4" fill="#E4DFD9" />
    <rect x="176" y="137" width="66" height="18" rx="9" fill="#FDE3CF" />
    <text x="209" y="149" font-family="Arial, sans-serif" font-size="8.5" font-weight="600" fill="#C2571A" text-anchor="middle">Contractor</text>

    <!-- row 3 -->
    <circle cx="56" cy="186" r="14" fill="#FDE3CF" />
    <text x="56" y="191" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#C2571A" text-anchor="middle">RK</text>
    <rect x="80" y="181" width="50" height="9" rx="4" fill="#E4DFD9" />
    <rect x="176" y="177" width="66" height="18" rx="9" fill="#FDE3CF" />
    <text x="209" y="189" font-family="Arial, sans-serif" font-size="8.5" font-weight="600" fill="#C2571A" text-anchor="middle">Contractor</text>

    <!-- row 4 (fading) -->
    <circle cx="56" cy="222" r="12" fill="#F0EEEB" />
    <rect x="78" y="217" width="90" height="8" rx="4" fill="#F0EEEB" />
  </g>

  <!-- Roles & Permissions card -->
  <g>
    <rect x="196" y="130" width="220" height="150" rx="18" fill="#FFFFFF" stroke="#EFE9E3" stroke-width="1.5" />
    <text x="220" y="164" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#222221">Roles &amp; Permissions</text>

    <rect x="220" y="182" width="34" height="34" rx="10" fill="#EDE9FE" />
    <path d="M237 191 l4 4 8 -8" stroke="#6D28D9" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="266" y="188" width="120" height="8" rx="4" fill="#E4DFD9" />
    <rect x="266" y="202" width="80" height="7" rx="3.5" fill="#EFE9E3" />

    <rect x="220" y="228" width="34" height="34" rx="10" fill="#FDE3CF" />
    <circle cx="237" cy="240" r="5" fill="#F4842B" />
    <path d="M229 254 q8 -10 16 0" stroke="#F4842B" stroke-width="2.4" fill="none" stroke-linecap="round" />
    <rect x="266" y="234" width="110" height="8" rx="4" fill="#E4DFD9" />
    <rect x="266" y="248" width="70" height="7" rx="3.5" fill="#EFE9E3" />
  </g>

  <!-- shield + lock badge -->
  <g transform="translate(150 214)">
    <circle cx="42" cy="42" r="46" fill="#F4842B" />
    <path d="M42 6 L74 18 V44 C74 66 60 80 42 88 C24 80 10 66 10 44 V18 Z" fill="#FFFFFF" opacity="0.95" />
    <rect x="27" y="44" width="30" height="24" rx="5" fill="#F4842B" />
    <path d="M32 44 v-8 a10 10 0 0 1 20 0 v8" stroke="#F4842B" stroke-width="5" fill="none" />
    <circle cx="42" cy="56" r="3.5" fill="#FFFFFF" />
  </g>
</svg>
