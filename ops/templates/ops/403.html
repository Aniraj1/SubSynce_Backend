{% extends 'ops/layouts/app.html' %}

{% block title %}No Access - SubSync{% endblock %}

{% block page %}
<div class="max-w-md mx-auto text-center py-16">
    <div class="w-14 h-14 mx-auto rounded-2xl bg-error/10 flex items-center justify-center mb-4">
        <span class="material-symbols-outlined text-error" aria-hidden="true">lock</span>
    </div>
    <h1 class="text-xl font-bold text-ink">No Access</h1>
    <p class="text-ink-light text-sm mt-2">{{ message }}</p>
    <a href="{% url 'ops:dashboard' %}" class="inline-flex items-center gap-2 mt-6 px-4 py-2.5 rounded-xl bg-ink text-surface text-sm font-medium hover:bg-primary transition-colors">
        Back to Dashboard
    </a>
</div>
{% endblock %}
