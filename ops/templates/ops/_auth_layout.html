{% extends 'base.html' %}

{% block force_light_theme %}true{% endblock %}
{# Shared shell for the password reset pages: peach background, arc decoration, centered card. #}

{% block content %}
<main class="min-h-screen flex items-center justify-center px-4 py-12 text-[#222222] bg-gradient-to-b from-[#FCEEE3] via-[#F9F1EB] to-[#F6F5F4] overflow-x-hidden">
    <div class="relative w-full {% block card_width %}max-w-[907px]{% endblock %}">
        <!-- Orange arcs near the card's top-right corner -->
        <svg aria-hidden="true" class="hidden lg:block absolute -top-12 -right-11 w-[54px] h-[54px] text-[#F27E22]/40" viewBox="0 0 54 54" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M2 2a50 50 0 0 1 50 50"/><path d="M2 12a40 40 0 0 1 40 40"/><path d="M2 22a30 30 0 0 1 30 30"/>
        </svg>
        <div class="relative bg-white rounded-lg border border-[#F0E6DD] shadow-[0_8px_32px_rgba(0,0,0,0.06)] px-6 sm:px-10 py-12">
            {% block card %}{% endblock %}
        </div>
    </div>
</main>
{% endblock %}
