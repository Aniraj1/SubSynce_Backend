{% extends 'ops/_auth_layout.html' %}

{% block title %}Password reset - SubSync{% endblock %}
{% block card_width %}max-w-[532px]{% endblock %}

{% block card %}
<div class="text-center">
    <span class="mx-auto w-[52px] h-[52px] rounded-full bg-[#FAF2E8] flex items-center justify-center text-[#F27E22]">
        <span class="material-symbols-outlined" style="font-size: 26px;">task_alt</span>
    </span>
    <h1 class="mt-6 text-[22px] font-semibold">Password reset successful</h1>
    <p class="mt-3 text-[15px] leading-relaxed text-[#494949]">You can now sign in with your new password.</p>
    <a href="{% url 'ops:login' %}"
       class="mt-10 w-full h-12 rounded-lg bg-[#F27E22] hover:bg-primary-hover text-white text-[15px] font-medium flex items-center justify-center gap-2 transition-colors">
        Back to sign in
    </a>
</div>
{% endblock %}
